name: Backend Tests & Security

on:
  push:
    branches: [ main, develop ]
    paths:
      - 'backend/**'
      - '.github/workflows/backend-tests.yml'
  pull_request:
    branches: [ main, develop ]
    paths:
      - 'backend/**'

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpass
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
        cache: 'pip'
    
    - name: Install dependencies
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    - name: Set up environment variables
      working-directory: ./backend
      run: |
        cat > .env << EOF
        MONGODB_URI=mongodb://testuser:testpass@localhost:27017/ecell_test?authSource=admin
        SECRET_KEY=test-secret-key-32-characters-long-1234
        GOOGLE_CLIENT_ID=test-client-id
        GOOGLE_CLIENT_SECRET=test-client-secret
        ADMIN_EMAIL=admin@test.com
        ADMIN_PASSWORD_HASH=\$2b\$12\$R9h7cIPz0gi.URNNX3kh2OPST9/PgBkqquzi.Ee7KK/U0XxsqgADO
        ALLOWED_DOMAINS=test.com,example.com
        FRONTEND_URL=http://localhost:3000
        ENVIRONMENT=testing
        EOF
    
    - name: Run linting
      working-directory: ./backend
      run: |
        pip install flake8
        flake8 app/ --count --select=E9,F63,F7,F82 --show-source --statistics
        flake8 app/ --count --exit-zero --max-complexity=10 --max-line-length=120 --statistics
    
    - name: Run unit tests
      working-directory: ./backend
      run: |
        pytest tests/ -v --cov=app --cov-report=xml --cov-report=term-missing
    
    - name: Upload coverage to Codecov
      uses: codecov/codecov-action@v3
      with:
        files: ./backend/coverage.xml
        flags: backend
        fail_ci_if_error: false
    
    - name: Security check - bandit
      working-directory: ./backend
      run: |
        pip install bandit
        bandit -r app/ -f json -o bandit-report.json || true
    
    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: bandit-security-report
        path: ./backend/bandit-report.json
