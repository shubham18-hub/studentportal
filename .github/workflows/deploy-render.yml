name: Deploy to Render

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    
    services:
      mongodb:
        image: mongo:7.0
        env:
          MONGO_INITDB_ROOT_USERNAME: testuser
          MONGO_INITDB_ROOT_PASSWORD: testpass
        options: >-
          --health-cmd mongosh
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 27017:27017

    steps:
    - uses: actions/checkout@v3
    
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'
    
    - name: Set up Node.js
      uses: actions/setup-node@v3
      with:
        node-version: '18.x'
    
    # Backend tests
    - name: Install and test backend
      working-directory: ./backend
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        cat > .env << EOF
        MONGODB_URI=mongodb://testuser:testpass@localhost:27017/ecell_test?authSource=admin
        SECRET_KEY=test-secret-key-32-characters-long-1234
        GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}
        GOOGLE_CLIENT_SECRET=${{ secrets.GOOGLE_CLIENT_SECRET }}
        ADMIN_EMAIL=${{ secrets.ADMIN_EMAIL }}
        ADMIN_PASSWORD_HASH=${{ secrets.ADMIN_PASSWORD_HASH }}
        ALLOWED_DOMAINS=klecba.edu.in,kle.ac.in,klecba.edu
        FRONTEND_URL=${{ secrets.FRONTEND_URL }}
        ENVIRONMENT=production
        EOF
        pytest tests/ -v --tb=short
    
    # Frontend tests
    - name: Install and test frontend
      working-directory: ./frontend
      run: |
        npm ci
        npm run build
    
    - name: Deploy to Render
      run: |
        echo "✅ All tests passed. Ready for deployment."
        echo "Render will automatically deploy when webhook is triggered."
        echo "Deployment status: https://dashboard.render.com"
      env:
        RENDER_DEPLOY_WEBHOOK: ${{ secrets.RENDER_DEPLOY_WEBHOOK }}
