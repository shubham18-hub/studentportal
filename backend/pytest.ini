[pytest]
minversion = 7.0
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

markers =
    auth: Authentication tests
    security: Security tests
    scalability: Scalability tests
    integration: Integration tests
    slow: Slow tests
