version: '3.8'

services:
  mongodb:
    image: mongo:7.0-alpine
    container_name: ecell-mongo-prod
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo_data_prod:/data/db
    restart: always
    networks:
      - ecell-network-prod

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ecell-backend-prod
    environment:
      MONGODB_URI: mongodb://${MONGO_USER}:${MONGO_PASSWORD}@mongodb:27017/ecell?authSource=admin
      SECRET_KEY: ${SECRET_KEY}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      ADMIN_EMAIL: ${ADMIN_EMAIL}
      ADMIN_PASSWORD_HASH: ${ADMIN_PASSWORD_HASH}
      ALLOWED_DOMAINS: ${ALLOWED_DOMAINS}
      FRONTEND_URL: ${FRONTEND_URL}
      ENVIRONMENT: production
    ports:
      - "8000:8000"
    depends_on:
      mongodb:
        condition: service_started
    networks:
      - ecell-network-prod
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ecell-frontend-prod
    environment:
      VITE_API_URL: ${VITE_API_URL}
      VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - ecell-network-prod
    restart: always

  nginx:
    image: nginx:alpine
    container_name: ecell-nginx
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - backend
      - frontend
    networks:
      - ecell-network-prod
    restart: always

volumes:
  mongo_data_prod:

networks:
  ecell-network-prod:
    driver: bridge
